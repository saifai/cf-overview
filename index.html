<style>
  :root { --ground:#F4F6FA; --ink:#172244; --muted:#4A5570; --accent:#33549A; --rule:#D5DCE8; --error:#A3242F;
          --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.5;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:380px; }
  .brand { margin:0 0 32px; font-size:20px; font-weight:800; }

  p.lede { margin:0 0 24px; color:var(--muted); }
  label { display:block; margin-bottom:6px; font-weight:600; font-size:15px; }
  input { width:100%; min-height:48px; padding:0 14px; border:1px solid var(--rule); border-radius:6px; background:#fff;
          color:var(--ink); font:400 17px var(--font); }
  input:focus { outline:3px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  button { width:100%; min-height:48px; margin-top:12px; border:0; border-radius:6px; background:var(--accent); color:#fff;
           font:600 16px var(--font); cursor:pointer; }
  button:hover { background:var(--ink); }
  button:disabled { opacity:.7; cursor:progress; }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .error { min-height:24px; margin:12px 0 0; color:var(--error); font-size:15px; }
</style>

  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  async function unlock(pw){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(DATA.s), iterations:DATA.n, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.i)}, key, b64(DATA.c));
    return new TextDecoder().decode(plain);
  }
  document.getElementById("f").addEventListener("submit", async function(e){

    var btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
    try {
      var html = await unlock(document.getElementById("pw").value);
      document.open(); document.write(html); document.close();
    } catch (x) {

      btn.disabled = false; btn.textContent = "View page";
      document.getElementById("pw").select();
